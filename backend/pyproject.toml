[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",  # function-call-in-default-argument: FastAPI's Depends(...) is meant to be used exactly this way.
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017"]  # pytest.raises(Exception) is intentional in a couple of "any parse failure" tests.
