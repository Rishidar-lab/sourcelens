name: CI

on:
  push:
    branches: [main]
  pull_request:

# No secrets and no network model calls: the backend suite runs fully offline
# (deterministic hash embeddings + a mock LLM, per backend/tests/conftest.py),
# and the frontend job is a pure type-check + production build.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # sentence-transformers pulls torch transitively; the default resolve can
      # grab a large CUDA wheel. SourceLens never needs a GPU (and the tests
      # never load the real model), so install the CPU build first — documented
      # in backend/requirements.txt.
      - name: Install CPU-only PyTorch
        run: pip install "torch==2.13.0" --index-url https://download.pytorch.org/whl/cpu

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        run: pytest -q

  frontend:
    name: frontend (tsc + vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Production build
        run: npm run build
